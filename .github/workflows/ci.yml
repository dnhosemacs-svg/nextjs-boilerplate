name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # postinstall (prisma generate) exige DIRECT_URL en prisma.config.ts
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

      # next.config.ts → assertServerEnv() en build (NODE_ENV=production)
      NEXTAUTH_SECRET: ci-build-secret-change-me
      NEXTAUTH_URL: https://ci.example.com
      FIREBASE_API_KEY: ci-firebase-api-key-dummy

      # GitHub OAuth: ambas vacías (válido según server-env.ts)
      GITHUB_ID: ""
      GITHUB_SECRET: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build
